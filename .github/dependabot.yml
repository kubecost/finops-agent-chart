version: 2

updates:
  # GitHub Actions used in .github/workflows. Keeps SHA pins and the trailing
  # version comment up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    # Major bumps are intentionally left ungrouped so each gets its own PR.

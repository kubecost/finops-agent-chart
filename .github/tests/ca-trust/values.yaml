# Values for the CA-trust end-to-end test. See run.sh in this directory for what the checks
# prove and what they cannot.
global:
  clusterId: ci-ca-trust
  updateCaTrust:
    enabled: true
    # Created by run.sh before install; the chart never creates it.
    caCertsSecret: ca-certs-secret
  federatedStorage:
    # Setting this enables the kubecost emitter, which validates the bucket at startup with a
    # write/read/delete round-trip and panics if it fails. That makes the agent's own TLS stack
    # the thing under test.
    #
    # endpoint must match NS in run.sh. insecure:false selects HTTPS. Leaving
    # http_config.tls_config.ca_file unset is load-bearing: an explicit CA file would pin
    # RootCAs and bypass SSL_CERT_FILE, which is exactly the path this test exists to cover.
    config: |-
      type: S3
      config:
        bucket: finops-ca-test
        endpoint: "minio.finops-ca-test.svc.cluster.local:9000"
        region: us-east-1
        access_key: minioadmin
        secret_key: minioadmin
        insecure: false

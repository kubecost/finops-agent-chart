# CI-only fixture for the ca-trust-e2e job. NOT part of the chart.
# HTTPS endpoint serving a cert signed by the job's throwaway CA; the TLS secret comes from
# the workflow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-probe-target-conf
data:
  default.conf: |
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        location / {
            return 200 "finops-ca-probe-ok\n";
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: ca-probe-target
  labels:
    app: ca-probe-target
spec:
  containers:
    - name: nginx
      image: nginx:1-alpine
      ports:
        - containerPort: 8443
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
      # Load-bearing: the job gates assertion B on `kubectl wait --for=condition=Ready`.
      readinessProbe:
        tcpSocket:
          port: 8443
        initialDelaySeconds: 2
        periodSeconds: 2
  volumes:
    - name: conf
      configMap:
        name: ca-probe-target-conf
    - name: tls
      secret:
        secretName: ca-probe-target-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ca-probe-target
spec:
  selector:
    app: ca-probe-target
  ports:
    - port: 443
      targetPort: 8443

name: Helm Validation
permissions:
  contents: read

on:
  workflow_dispatch: {}
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # cancel if new commits are pushed to the same branch

jobs:
  chart-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest  # latest version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint \
            --all \
            --validate-maintainers=false \
            --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Run chart-testing (kubecost specific)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm install finops-agent-chart-test \
            --namespace finops-agent-chart-test --create-namespace \
            --wait --wait-for-jobs --timeout 300s \
            ./charts/finops-agent \
            -f .github/configs/helmValues-helm-validation-kubecost.yaml

      - name: Wait for ready 
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl wait -n finops-agent-chart-test \
            --for=condition=ready pod \
            --selector app.kubernetes.io/instance=finops-agent-chart-test \
            --timeout=120s

  # Test cases live in charts/finops-agent/tests/*_test.yaml.
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2 --verify=false

      - name: Build chart dependencies
        run: helm dependency build ./charts/finops-agent

      - name: Run chart unit tests
        run: helm unittest ./charts/finops-agent

  # Verifies the global.updateCaTrust feature against a real cluster.
  # The checks and their known limitation are documented in the script itself.
  ca-trust-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC for the ECR Public pull role
    env:
      NS: finops-ca-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Build chart dependencies
        run: helm dependency build ./charts/finops-agent

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # Anonymous pulls from public.ecr.aws are rate limited and fail the MinIO fixture.
      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLIC_ROLE }}
          aws-region: us-east-1

      - name: Get ECR Public token
        run: |
          token=$(aws ecr-public get-login-password --region us-east-1)
          echo "::add-mask::$token"
          echo "ECR_PUBLIC_PASSWORD=$token" >> "$GITHUB_ENV"

      - name: Verify custom CA trust end to end
        run: .github/tests/ca-trust/run.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/name=finops-agent \
            --all-containers --tail=100 || true

  whitespace-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for trailing whitespace in all files
        run: |
          if grep -r --include="*.*" "[[:blank:]]$" charts/; then
            echo "Error: Found trailing whitespace in .md or .tpl files"
            exit 1
          fi
